[package]
name = "hivewise"
version = "0.1.0"
edition = "2021"
description = "Hivewise: a hexagonal bee puzzle game. Rust core compiled to WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
